# Self-hosted deploy (alternative to Vercel) — runs alongside other apps.
# Web (Next.js) + API (Hono/Bun) + Postgres.
#
# Bring up:  docker compose up -d --build
# Schema:    auto-applied on first DB init via /docker-entrypoint-initdb.d
#            (schema.sql then seed.sql). To re-apply on an existing volume:
#            docker compose exec -T db psql -U sitelog -d sitelog < packages/db/schema.sql
# Logs:      docker compose logs -f api web
#
# Put the public origins in .env (see .env.example). The API must be reachable
# FROM THE BROWSER (the auth client + status page call NEXT_PUBLIC_API_URL directly,
# not only via the web proxy) — so expose it on its own hostname (or host port), e.g.
#   NEXT_PUBLIC_WEB_URL=https://app.k11ops.com
#   NEXT_PUBLIC_API_URL=https://api.k11ops.com         # NOT the web URL — points at the api
#   BETTER_AUTH_URL=https://api.k11ops.com
#   BETTER_AUTH_TRUSTED_ORIGINS=https://app.k11ops.com,https://api.k11ops.com
# (LAN/no-DNS example: NEXT_PUBLIC_API_URL=http://<host-ip>:4000 — the api maps :4000.)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitelog
      POSTGRES_USER: sitelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied only when the data volume is empty (first boot):
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./packages/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitelog"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sitelog:${POSTGRES_PASSWORD:-changeme}@db:5432/sitelog
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}   # e.g. .k11ops.com — shares the session cookie across app.* + api.*
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      SITELOG_ADMIN_EMAILS: ${SITELOG_ADMIN_EMAILS:-}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sitelog/web build && pnpm --filter @sitelog/web start"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}   # public origin (browser/CSP)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}         # server-side rewrite target (internal)
    volumes:
      - .:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
