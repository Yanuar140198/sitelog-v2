# Self-hosted deploy alternative to Vercel.
# Web (Next.js) + API (Hono/Bun) + Postgres + reverse proxy.
#
# Bring up: docker compose up -d
# Migrate:  docker compose exec api bun packages/db/src/migrate.ts
# Logs:     docker compose logs -f api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitelog
      POSTGRES_USER: sitelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitelog"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sitelog:${POSTGRES_PASSWORD:-changeme}@db:5432/sitelog
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      SITELOG_ADMIN_EMAILS: ${SITELOG_ADMIN_EMAILS:-}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sitelog/web build && pnpm --filter @sitelog/web start"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
    volumes:
      - .:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
