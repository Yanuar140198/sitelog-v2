# Prometheus alert rules — copy into your alertmanager config.
groups:
  - name: sitelog-critical
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job="sitelog-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Sitelog API not responding"

      - alert: HighErrorRate
        expr: rate(sitelog_http_errors_total[5m]) / rate(sitelog_http_requests_total[5m]) > 0.05
        for: 5m
        labels: { severity: warning }

      - alert: ServerErrors5xx
        expr: rate(sitelog_http_5xx_total[5m]) > 0.1
        for: 2m
        labels: { severity: critical }

      - alert: DbScrapeFailed
        expr: sitelog_db_scrape_error > 0
        for: 5m
        labels: { severity: critical }

  - name: sitelog-warning
    interval: 60s
    rules:
      - alert: NoAuditEvents24h
        expr: sitelog_audit_events_24h == 0
        for: 30m
        labels: { severity: warning }

      - alert: WebhookDeliveryStalled
        expr: rate(sitelog_webhook_dispatched_total[15m]) == 0 and sitelog_webhooks_active > 0
        for: 30m
        labels: { severity: warning }

      - alert: AiQuotaSpike
        expr: rate(sitelog_ai_calls_total[5m]) > 1
        for: 5m
        labels: { severity: warning }
