name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: sitelog-api:ci
      - name: Verify image runs (5s startup)
        run: |
          docker run -d --name api-test -p 4000:4000 \
            -e DATABASE_URL=postgresql://stub:stub@localhost:5432/stub \
            -e BETTER_AUTH_SECRET=ci-stub-secret-32-bytes-long-stub \
            sitelog-api:ci || true
          sleep 5
          docker logs api-test || true
          docker stop api-test || true
