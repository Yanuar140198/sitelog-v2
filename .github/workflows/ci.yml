name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitelog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sitelog
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:apply  # apply full schema dump + reference seed (drizzle journal/TS/SQL diverged; the dump is the source of truth)
      - run: pnpm test  # unit (shared) + DB-backed tenant-isolation IDOR tests
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitelog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sitelog
      BETTER_AUTH_SECRET: ci-stub-secret-32-bytes-long-stub-secret-key
      SITELOG_ADMIN_EMAILS: demo@sitelog.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:apply  # apply full schema dump + reference seed (drizzle journal/TS/SQL diverged; the dump is the source of truth)
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-trace, path: test-results/ }

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: sitelog-api:ci
      - name: Verify image runs (5s startup)
        run: |
          docker run -d --name api-test -p 4000:4000 \
            -e DATABASE_URL=postgresql://stub:stub@localhost:5432/stub \
            -e BETTER_AUTH_SECRET=ci-stub-secret-32-bytes-long-stub \
            sitelog-api:ci || true
          sleep 5
          docker logs api-test || true
          docker stop api-test || true
