name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 12 * * 1'  # weekly Monday noon UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      # Uploading results needs GitHub code scanning enabled (Advanced Security on
      # private repos). Don't fail the PR when it isn't — the scan still runs and
      # will start reporting once code scanning is enabled / the repo is public.
      - uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: /language:${{ matrix.language }}
